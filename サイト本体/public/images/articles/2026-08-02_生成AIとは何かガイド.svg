<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.08">
    <circle cx="1020" cy="110" r="190"/>
    <circle cx="110" cy="540" r="150"/>
  </g>

  <!-- ネットワーク(生成AIの仕組みイメージ) -->
  <g transform="translate(950,340)" stroke="#ffffff" stroke-width="3" opacity="0.7">
    <line x1="0" y1="0" x2="-70" y2="-60"/>
    <line x1="0" y1="0" x2="70" y2="-60"/>
    <line x1="0" y1="0" x2="-70" y2="60"/>
    <line x1="0" y1="0" x2="70" y2="60"/>
    <line x1="-70" y1="-60" x2="-70" y2="60"/>
    <line x1="70" y1="-60" x2="70" y2="60"/>
  </g>
  <g fill="#fde047">
    <circle cx="950" cy="340" r="18"/>
  </g>
  <g fill="#ffffff">
    <circle cx="880" cy="280" r="12"/>
    <circle cx="1020" cy="280" r="12"/>
    <circle cx="880" cy="400" r="12"/>
    <circle cx="1020" cy="400" r="12"/>
  </g>

  <!-- キラキラ(生成イメージ) -->
  <g transform="translate(1010,120)" fill="#fde047">
    <polygon points="0,-40 10,-10 40,0 10,10 0,40 -10,10 -40,0 -10,-10"/>
  </g>

  <text x="90" y="220" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="52" font-weight="700" fill="#ffffff">生成AIとは?</text>
  <text x="90" y="290" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="44" font-weight="700" fill="#ffffff">初心者向けやさしく解説</text>
  <text x="90" y="350" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" fill="#ddd6fe">仕組み・種類・活用シーンまとめ</text>
  <text x="90" y="560" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="26" fill="#c4b5fd">nevora-ai</text>
</svg>
