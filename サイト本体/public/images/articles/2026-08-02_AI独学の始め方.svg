<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.08">
    <circle cx="1020" cy="110" r="190"/>
    <circle cx="110" cy="540" r="150"/>
  </g>

  <!-- 本アイコン -->
  <g transform="translate(970,350)">
    <path d="M -70 -60 L 0 -40 L 0 70 L -70 50 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M 70 -60 L 0 -40 L 0 70 L 70 50 Z" fill="#ecfccb" opacity="0.95"/>
    <line x1="-50" y1="-30" x2="-10" y2="-20" stroke="#4d7c0f" stroke-width="4"/>
    <line x1="-50" y1="0" x2="-10" y2="10" stroke="#4d7c0f" stroke-width="4"/>
    <line x1="50" y1="-30" x2="10" y2="-20" stroke="#4d7c0f" stroke-width="4"/>
    <line x1="50" y1="0" x2="10" y2="10" stroke="#4d7c0f" stroke-width="4"/>
  </g>

  <!-- 星(達成イメージ) -->
  <g transform="translate(1030,140)" fill="#fde047">
    <polygon points="0,-34 8,-8 34,0 8,8 0,34 -8,8 -34,0 -8,-8"/>
  </g>

  <text x="90" y="200" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="48" font-weight="700" fill="#ffffff">何から始める?</text>
  <text x="90" y="270" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="48" font-weight="700" fill="#ffffff">AI独学ロードマップ</text>
  <text x="90" y="330" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" fill="#ecfccb">初心者向けの学び方を整理</text>
  <text x="90" y="560" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="26" fill="#d9f99d">nevora-ai</text>
</svg>
