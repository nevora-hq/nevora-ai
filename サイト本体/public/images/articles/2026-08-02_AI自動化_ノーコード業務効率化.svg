<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.08">
    <circle cx="1020" cy="110" r="190"/>
    <circle cx="110" cy="540" r="150"/>
  </g>

  <!-- 歯車(自動化) -->
  <g transform="translate(970,340)" fill="#ffffff" opacity="0.95">
    <circle cx="0" cy="0" r="55"/>
    <g fill="url(#bg)">
      <circle cx="0" cy="0" r="24"/>
    </g>
    <g fill="#ffffff">
      <rect x="-8" y="-78" width="16" height="26" rx="4"/>
      <rect x="-8" y="52" width="16" height="26" rx="4"/>
      <rect x="-78" y="-8" width="26" height="16" rx="4"/>
      <rect x="52" y="-8" width="26" height="16" rx="4"/>
    </g>
  </g>

  <!-- フロー矢印(連携) -->
  <g stroke="#fde047" stroke-width="6" fill="none" opacity="0.9">
    <path d="M 860 460 Q 950 500 1040 460" stroke-linecap="round"/>
  </g>
  <polygon points="1040,460 1020,448 1024,470" fill="#fde047"/>

  <text x="90" y="200" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="48" font-weight="700" fill="#ffffff">プログラミング不要</text>
  <text x="90" y="270" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="48" font-weight="700" fill="#ffffff">AI×ノーコード自動化</text>
  <text x="90" y="330" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" fill="#ffedd5">業務効率化の始め方を手順で解説</text>
  <text x="90" y="560" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="26" fill="#ccfbf1">nevora-ai</text>
</svg>
