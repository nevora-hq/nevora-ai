<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9d174d"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.08">
    <circle cx="1020" cy="110" r="190"/>
    <circle cx="110" cy="540" r="150"/>
  </g>

  <!-- コイン(副収入イメージ) -->
  <g transform="translate(970,360)">
    <circle cx="-30" cy="20" r="55" fill="#fde047" opacity="0.95"/>
    <circle cx="40" cy="-30" r="55" fill="#fef08a" opacity="0.95"/>
    <text x="40" y="-15" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="40" font-weight="700" fill="#a16207" text-anchor="middle">¥</text>
  </g>

  <!-- 成長グラフ -->
  <g stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <polyline points="850,480 920,440 990,460 1080,380"/>
  </g>
  <polygon points="1080,380 1055,388 1068,405" fill="#ffffff"/>

  <text x="90" y="200" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="48" font-weight="700" fill="#ffffff">何もわからない</text>
  <text x="90" y="270" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="48" font-weight="700" fill="#ffffff">状態からのAI副業</text>
  <text x="90" y="330" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" fill="#fce7f3">種類・始め方・注意点を解説</text>
  <text x="90" y="560" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="26" fill="#f5d0fe">nevora-ai</text>
</svg>
