<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.08">
    <circle cx="1020" cy="110" r="190"/>
    <circle cx="110" cy="540" r="150"/>
  </g>

  <!-- ロボット(エージェント)アイコン -->
  <g transform="translate(970,350)">
    <rect x="-70" y="-50" width="140" height="110" rx="24" fill="#ffffff" opacity="0.95"/>
    <circle cx="-30" cy="0" r="14" fill="#0e7490"/>
    <circle cx="30" cy="0" r="14" fill="#0e7490"/>
    <rect x="-30" y="30" width="60" height="10" rx="5" fill="#0e7490" opacity="0.6"/>
    <line x1="0" y1="-50" x2="0" y2="-80" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="-88" r="10" fill="#fde047"/>
    <rect x="-95" y="-10" width="20" height="50" rx="10" fill="#ffffff" opacity="0.95"/>
    <rect x="75" y="-10" width="20" height="50" rx="10" fill="#ffffff" opacity="0.95"/>
  </g>

  <text x="90" y="200" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="48" font-weight="700" fill="#ffffff">AIエージェント</text>
  <text x="90" y="270" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="48" font-weight="700" fill="#ffffff">とは?</text>
  <text x="90" y="330" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" fill="#cffafe">仕組みと生成AIとの違いを解説</text>
  <text x="90" y="560" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="26" fill="#a5f3fc">nevora-ai</text>
</svg>
