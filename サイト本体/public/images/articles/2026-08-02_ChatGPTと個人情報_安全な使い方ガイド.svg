<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.08">
    <circle cx="1020" cy="110" r="190"/>
    <circle cx="110" cy="540" r="150"/>
  </g>

  <!-- 盾アイコン(セキュリティ) -->
  <g transform="translate(970,340)">
    <path d="M0,-90 L70,-60 L70,10 C70,60 35,95 0,110 C-35,95 -70,60 -70,10 L-70,-60 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M-28,0 L-8,22 L32,-22" fill="none" stroke="#0f766e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 鍵アイコン -->
  <g transform="translate(1030,140)" opacity="0.95">
    <circle cx="0" cy="-14" r="18" fill="none" stroke="#fde047" stroke-width="7"/>
    <rect x="-16" y="0" width="32" height="28" rx="6" fill="#fde047"/>
  </g>

  <!-- チャット吹き出し -->
  <g transform="translate(870,500)" opacity="0.9">
    <rect x="-55" y="-40" width="150" height="80" rx="18" fill="#ffffff" opacity="0.9"/>
    <path d="M -25 40 L -45 65 L 0 40 Z" fill="#ffffff" opacity="0.9"/>
    <rect x="-35" y="-20" width="100" height="12" rx="6" fill="#0f766e" opacity="0.5"/>
    <rect x="-35" y="0" width="70" height="12" rx="6" fill="#0f766e" opacity="0.5"/>
  </g>

  <text x="90" y="220" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="50" font-weight="700" fill="#ffffff">ChatGPTと個人情報</text>
  <text x="90" y="290" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="50" font-weight="700" fill="#ffffff">安全な使い方ガイド</text>
  <text x="90" y="350" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" fill="#bae6fd">入力してはいけない情報とは?</text>
  <text x="90" y="390" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="26" fill="#bae6fd">情報漏洩を防ぐチェックリスト</text>
  <text x="90" y="560" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="26" fill="#a7f3d0">nevora-ai</text>
</svg>
